name: build-macos-git-pkg

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -euxo pipefail
          sw_vers
          uname -a
          xcode-select -p || true
          clang --version || true
          make --version || true

      - name: Debug Makefile around the failing line
        run: |
          set -euxo pipefail
          nl -ba Makefile | sed -n '35,55p'

      - name: Build installer package (override XML_CATALOG_FILES)
        run: |
          set -euxo pipefail
          make clean XML_CATALOG_FILES= || true
          make package XML_CATALOG_FILES=

      - name: List outputs
        if: always()
        run: |
          set -euxo pipefail
          echo "=== repo root ==="
          ls -lah
          echo "=== build/ ==="
          ls -lah build || true
          echo "=== tmp/ ==="
          ls -lah tmp || true
          echo "=== stage/ ==="
          ls -lah stage || true
          echo "=== stage-arm/ ==="
          ls -lah stage-arm || true
          echo "=== stage-intel/ ==="
          ls -lah stage-intel || true

      - name: Upload artifacts (pkg/dmg/zip)
        uses: actions/upload-artifact@v4
        with:
          name: git-osx-installer
          path: |
            git-*.pkg
            git-*.dmg
            git-*.zip
            build/**/*.pkg
            build/**/*.dmg
            build/**/*.zip
            tmp/**/*.pkg
            tmp/**/*.dmg
            tmp/**/*.zip
            stage/**/*.pkg
            stage/**/*.dmg
            stage/**/*.zip
