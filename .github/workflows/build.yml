name: build-macos-git-pkg

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show toolchain
        run: |
          set -euxo pipefail
          sw_vers
          uname -a
          xcode-select -p || true
          clang --version || true

      # Install GNU make without Homebrew
      - name: Build and install GNU make (local)
        run: |
          set -euxo pipefail
          MAKE_VER="4.4.1"
          cd "$RUNNER_TEMP"
          curl -fsSL -o make.tar.gz "https://ftp.gnu.org/gnu/make/make-${MAKE_VER}.tar.gz"
          tar xzf make.tar.gz
          cd "make-${MAKE_VER}"
          ./configure --prefix="$HOME/gmake"
          /usr/bin/make -j"$(sysctl -n hw.ncpu)"
          /usr/bin/make install
          echo "$HOME/gmake/bin" >> "$GITHUB_PATH"
          make --version

      # KEY FIX: satisfy bin/find-file during Makefile parse
      - name: Provision XML catalog paths for Makefile
        run: |
          set -euxo pipefail
          sudo mkdir -p /usr/local/etc/xml
          sudo touch /usr/local/etc/xml/catalog
          sudo mkdir -p /opt/homebrew/etc/xml
          sudo touch /opt/homebrew/etc/xml/catalog
          ls -lah /usr/local/etc/xml/catalog
          ls -lah /opt/homebrew/etc/xml/catalog

      - name: Debug Makefile line 35-55
        run: |
          set -euxo pipefail
          nl -ba Makefile | sed -n '35,55p'

      - name: Build installer package
        run: |
          set -euxo pipefail
          make clean || true
          make package

      - name: List outputs
        if: always()
        run: |
          set -euxo pipefail
          ls -lah
          ls -lah build || true
          ls -lah tmp || true
          ls -lah stage || true
          ls -lah stage-arm || true
          ls -lah stage-intel || true

      - name: Upload artifacts (pkg/dmg/zip)
        uses: actions/upload-artifact@v4
        with:
          name: git-osx-installer
          path: |
            git-*.pkg
            git-*.dmg
            git-*.zip
            build/**/*.pkg
            tmp/**/*.pkg
            stage/**/*.pkg
