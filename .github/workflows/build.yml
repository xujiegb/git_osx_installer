name: build-macos-git-pkg

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show environment
        run: |
          set -euxo pipefail
          sw_vers
          uname -a
          xcode-select -p || true
          clang --version || true
          make --version || true
          command -v brew || true
          command -v git || true

      # Key fix: Makefile evals XML_CATALOG_FILES at parse-time via bin/find-file.
      # Provide a catalog path so parsing doesn't explode.
      - name: Provide xml catalog file for Makefile
        run: |
          set -euxo pipefail
          sudo mkdir -p /usr/local/etc/xml
          sudo touch /usr/local/etc/xml/catalog
          ls -lah /usr/local/etc/xml/catalog

      - name: Build installer package
        run: |
          set -euxo pipefail
          make clean || true
          make package

      - name: List outputs
        if: always()
        run: |
          set -euxo pipefail
          ls -lah
          ls -lah build || true
          ls -lah tmp || true
          ls -lah stage || true
          ls -lah stage-arm || true
          ls -lah stage-intel || true

      - name: Upload artifacts (pkg/dmg/zip)
        uses: actions/upload-artifact@v4
        with:
          name: git-osx-installer
          path: |
            git-*.pkg
            git-*.dmg
            git-*.zip
            build/**/*.pkg
            build/**/*.dmg
            build/**/*.zip
            tmp/**/*.pkg
            tmp/**/*.dmg
            tmp/**/*.zip
            stage/**/*.pkg
            stage/**/*.dmg
            stage/**/*.zip
