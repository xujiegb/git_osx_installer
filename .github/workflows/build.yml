name: build-macos-git-pkg

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build GNU make 4.4.1 (no Homebrew)
        shell: bash
        run: |
          set -euo pipefail
          MAKE_VER="4.4.1"
          cd "$RUNNER_TEMP"
          curl -fsSL -o "make-${MAKE_VER}.tar.gz" "https://ftp.gnu.org/gnu/make/make-${MAKE_VER}.tar.gz"
          tar xzf "make-${MAKE_VER}.tar.gz"
          cd "make-${MAKE_VER}"
          ./configure --prefix="$HOME/gmake"
          /usr/bin/make -j"$(sysctl -n hw.ncpu)"
          /usr/bin/make install
          "$HOME/gmake/bin/make" --version

      - name: Provision XML catalog paths
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/local/etc/xml
          sudo touch /usr/local/etc/xml/catalog
          sudo mkdir -p /opt/homebrew/etc/xml
          sudo touch /opt/homebrew/etc/xml/catalog
          ls -lah /usr/local/etc/xml/catalog
          ls -lah /opt/homebrew/etc/xml/catalog

      - name: Resolve Git VERSION
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          # Try the repo script first (ignore failures)
          RAW="$(bin/latest-git-version 2>/dev/null || true)"
          echo "latest-git-version output: ${RAW}"
          VER="$(printf "%s\n" "$RAW" | tr -d '\r' | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"

          # Fallback: parse from kernel.org directory listing
          if [[ -z "$VER" ]]; then
            VER="$(curl -fsSL "https://www.kernel.org/pub/software/scm/git/" \
              | grep -Eo 'git-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' \
              | sed 's/^git-//; s/\.tar\.gz$//' \
              | sort -V \
              | tail -n1 || true)"
          fi

          if [[ -z "$VER" ]]; then
            echo "ERROR: Unable to resolve Git version." >&2
            exit 1
          fi

          echo "Resolved VERSION=$VER"
          echo "VERSION=$VER" >> "$GITHUB_OUTPUT"

      - name: Build package
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          set -euo pipefail
          "$HOME/gmake/bin/make" clean VERSION="$VERSION" || true
          "$HOME/gmake/bin/make" package VERSION="$VERSION"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: git-osx-installer
          path: |
            git-*.pkg
            git-*.dmg
            git-*.zip
            build/**/*.pkg
            tmp/**/*.pkg
            stage/**/*.pkg
