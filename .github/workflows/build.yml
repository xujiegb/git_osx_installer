name: build-macos-git-pkg

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build GNU make 4.4.1
        shell: bash
        run: |
          set -euo pipefail
          MAKE_VER="4.4.1"
          cd "$RUNNER_TEMP"
          curl -fsSL -o "make-${MAKE_VER}.tar.gz" "https://ftp.gnu.org/gnu/make/make-${MAKE_VER}.tar.gz"
          tar xzf "make-${MAKE_VER}.tar.gz"
          cd "make-${MAKE_VER}"
          ./configure --prefix="$HOME/gmake"
          /usr/bin/make -j"$(sysctl -n hw.ncpu)"
          /usr/bin/make install
          "$HOME/gmake/bin/make" --version

      - name: Ensure XML catalog paths exist
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/local/etc/xml
          sudo touch /usr/local/etc/xml/catalog
          sudo mkdir -p /opt/homebrew/etc/xml
          sudo touch /opt/homebrew/etc/xml/catalog

      - name: Install OpenSSL
        shell: bash
        run: |
          set -euo pipefail
          if command -v brew >/dev/null 2>&1; then
            BREW="$(command -v brew)"
          elif [[ -x /opt/homebrew/bin/brew ]]; then
            BREW="/opt/homebrew/bin/brew"
          elif [[ -x /usr/local/bin/brew ]]; then
            BREW="/usr/local/bin/brew"
          else
            echo "brew not found" >&2
            exit 1
          fi
          "$BREW" update
          "$BREW" install openssl@3 pkg-config
          OPENSSL_PREFIX="$("$BREW" --prefix openssl@3)"
          echo "OPENSSL_PREFIX=$OPENSSL_PREFIX" >> "$GITHUB_ENV"
          echo "BREW=$BREW" >> "$GITHUB_ENV"
          ls -lah "$OPENSSL_PREFIX/include/openssl/ssl.h"

      - name: Resolve Git VERSION
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          RAW="$(bin/latest-git-version 2>/dev/null || true)"
          VER="$(printf "%s\n" "$RAW" | tr -d '\r' | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
          if [[ -z "$VER" ]]; then
            VER="$(curl -fsSL "https://www.kernel.org/pub/software/scm/git/" \
              | grep -Eo 'git-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' \
              | sed 's/^git-//; s/\.tar\.gz$//' \
              | sort -V \
              | tail -n1 || true)"
          fi
          if [[ -z "$VER" ]]; then
            echo "ERROR: Unable to resolve Git version." >&2
            exit 1
          fi
          echo "VERSION=$VER" >> "$GITHUB_OUTPUT"

      - name: Patch Makefile for osxkeychain
        shell: bash
        env:
          OPENSSL_PREFIX: ${{ env.OPENSSL_PREFIX }}
        run: |
          set -euo pipefail
          OPENSSL_INC="-I${OPENSSL_PREFIX}/include"
          OPENSSL_LIB="-L${OPENSSL_PREFIX}/lib"
          perl -0pi -e '
            my $inc = $ENV{"OPENSSL_INC"};
            my $lib = $ENV{"OPENSSL_LIB"};
            $inc =~ s/"/\\"/g; $lib =~ s/"/\\"/g;
            s{
              cd\ "\$\(BUILD_DIR\)/git-\$\*/contrib/credential/osxkeychain";\s*\$\(SUBMAKE_\$\{\*\}\)\s*([^\n]*)
            }{
              qq{cd "\$(BUILD_DIR)/git-\$*/contrib/credential/osxkeychain"; \$(SUBMAKE_\${*}) CPPFLAGS="-I\$(PWD)/\$(BUILD_DIR)/git-\$* $inc" LDFLAGS="\$(LDFLAGS_\${*}) $lib -lz -liconv -framework Security -framework CoreFoundation -lssl -lcrypto" $1}
            }gexm;
          ' Makefile
          echo "OPENSSL_INC=$OPENSSL_INC" >> "$GITHUB_ENV"
          echo "OPENSSL_LIB=$OPENSSL_LIB" >> "$GITHUB_ENV"

      - name: Build package
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
          OPENSSL_PREFIX: ${{ env.OPENSSL_PREFIX }}
        run: |
          set -euo pipefail
          OPENSSL_INC="-I${OPENSSL_PREFIX}/include"
          OPENSSL_LIB="-L${OPENSSL_PREFIX}/lib"
          KEYCHAIN_LINK="-lz -liconv -framework Security -framework CoreFoundation -lssl -lcrypto"
          "$HOME/gmake/bin/make" clean VERSION="$VERSION" || true
          "$HOME/gmake/bin/make" package VERSION="$VERSION" \
            CFLAGS_arm="-target arm64-apple-macos11 ${OPENSSL_INC}" \
            LDFLAGS_arm="-target arm64-apple-macos11 ${OPENSSL_LIB} ${KEYCHAIN_LINK}" \
            CFLAGS_intel="-target x86_64-apple-macos10.13 ${OPENSSL_INC}" \
            LDFLAGS_intel="-target x86_64-apple-macos10.13 ${OPENSSL_LIB} ${KEYCHAIN_LINK}"

      - name: List outputs
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ls -lah
          ls -lah build || true
          ls -lah tmp || true
          ls -lah stage || true
          ls -lah stage-arm || true
          ls -lah stage-intel || true

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: git-osx-installer
          path: |
            git-*.pkg
            git-*.dmg
            git-*.zip
            build/**/*.pkg
            tmp/**/*.pkg
            stage/**/*.pkg
