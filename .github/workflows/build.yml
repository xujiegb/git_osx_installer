name: build-macos-git-pkg

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build GNU make 4.4.1 (no Homebrew needed)
        shell: bash
        run: |
          set -euo pipefail
          MAKE_VER="4.4.1"
          cd "$RUNNER_TEMP"
          curl -fsSL -o "make-${MAKE_VER}.tar.gz" "https://ftp.gnu.org/gnu/make/make-${MAKE_VER}.tar.gz"
          tar xzf "make-${MAKE_VER}.tar.gz"
          cd "make-${MAKE_VER}"
          ./configure --prefix="$HOME/gmake"
          /usr/bin/make -j"$(sysctl -n hw.ncpu)"
          /usr/bin/make install
          "$HOME/gmake/bin/make" --version

      - name: Ensure XML catalog paths exist (Makefile parse-time)
        shell: bash
        run: |
          set -euo pipefail
          sudo mkdir -p /usr/local/etc/xml
          sudo touch /usr/local/etc/xml/catalog
          sudo mkdir -p /opt/homebrew/etc/xml
          sudo touch /opt/homebrew/etc/xml/catalog

      - name: Install OpenSSL (Homebrew)
        shell: bash
        run: |
          set -euo pipefail
          # Homebrew exists on GitHub macOS runners, but PATH may vary.
          if command -v brew >/dev/null 2>&1; then
            BREW="$(command -v brew)"
          elif [[ -x /opt/homebrew/bin/brew ]]; then
            BREW="/opt/homebrew/bin/brew"
          elif [[ -x /usr/local/bin/brew ]]; then
            BREW="/usr/local/bin/brew"
          else
            echo "brew not found" >&2
            exit 1
          fi
          echo "Using brew: $BREW"
          "$BREW" update
          "$BREW" install openssl@3 pkg-config

          # Export env for later steps (for logging / optional use)
          OPENSSL_PREFIX="$("$BREW" --prefix openssl@3)"
          echo "OPENSSL_PREFIX=$OPENSSL_PREFIX" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=$OPENSSL_PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "CPPFLAGS=-I$OPENSSL_PREFIX/include" >> "$GITHUB_ENV"
          echo "LDFLAGS=-L$OPENSSL_PREFIX/lib" >> "$GITHUB_ENV"

          echo "openssl prefix: $OPENSSL_PREFIX"
          ls -lah "$OPENSSL_PREFIX/include/openssl/ssl.h"

      - name: Resolve Git VERSION
        id: ver
        shell: bash
        run: |
          set -euo pipefail
          RAW="$(bin/latest-git-version 2>/dev/null || true)"
          VER="$(printf "%s\n" "$RAW" | tr -d '\r' | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
          if [[ -z "$VER" ]]; then
            VER="$(curl -fsSL "https://www.kernel.org/pub/software/scm/git/" \
              | grep -Eo 'git-[0-9]+\.[0-9]+\.[0-9]+\.tar\.gz' \
              | sed 's/^git-//; s/\.tar\.gz$//' \
              | sort -V \
              | tail -n1 || true)"
          fi
          [[ -n "$VER" ]]
          echo "VERSION=$VER" >> "$GITHUB_OUTPUT"

      - name: Build package
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.VERSION }}
        run: |
          set -euo pipefail

          # Find brew (again, in case PATH differs across steps)
          if command -v brew >/dev/null 2>&1; then
            BREW="$(command -v brew)"
          elif [[ -x /opt/homebrew/bin/brew ]]; then
            BREW="/opt/homebrew/bin/brew"
          elif [[ -x /usr/local/bin/brew ]]; then
            BREW="/usr/local/bin/brew"
          else
            echo "brew not found" >&2
            exit 1
          fi

          OPENSSL_PREFIX="$("$BREW" --prefix openssl@3)"
          OPENSSL_INC="-I${OPENSSL_PREFIX}/include"
          OPENSSL_LIB="-L${OPENSSL_PREFIX}/lib"

          echo "Using VERSION=$VERSION"
          echo "Using OPENSSL_PREFIX=$OPENSSL_PREFIX"
          echo "Injecting OPENSSL_INC=$OPENSSL_INC"
          echo "Injecting OPENSSL_LIB=$OPENSSL_LIB"
          ls -lah "${OPENSSL_PREFIX}/include/openssl/ssl.h"

          # Force GNU make, override arch flags to include OpenSSL include/lib paths
          "$HOME/gmake/bin/make" clean VERSION="$VERSION" || true

          "$HOME/gmake/bin/make" package VERSION="$VERSION" \
            CFLAGS_arm="-target arm64-apple-macos11 ${OPENSSL_INC}" \
            LDFLAGS_arm="-target arm64-apple-macos11 ${OPENSSL_LIB}" \
            CFLAGS_intel="-target x86_64-apple-macos10.12 ${OPENSSL_INC}" \
            LDFLAGS_intel="-target x86_64-apple-macos10.12 ${OPENSSL_LIB}"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: git-osx-installer
          path: |
            git-*.pkg
            git-*.dmg
            git-*.zip
            build/**/*.pkg
            tmp/**/*.pkg
            stage/**/*.pkg
