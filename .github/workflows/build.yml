name: build-macos-git-pkg

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"
  pull_request:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build and install GNU make (local)
        run: |
          set -euxo pipefail
          MAKE_VER="4.4.1"
          cd "$RUNNER_TEMP"
          curl -fsSL -o make.tar.gz "https://ftp.gnu.org/gnu/make/make-${MAKE_VER}.tar.gz"
          tar xzf make.tar.gz
          cd "make-${MAKE_VER}"
          ./configure --prefix="$HOME/gmake"
          /usr/bin/make -j"$(sysctl -n hw.ncpu)"
          /usr/bin/make install
          "$HOME/gmake/bin/make" --version

      - name: Provision XML catalog paths
        run: |
          set -euxo pipefail
          sudo mkdir -p /usr/local/etc/xml
          sudo touch /usr/local/etc/xml/catalog
          sudo mkdir -p /opt/homebrew/etc/xml
          sudo touch /opt/homebrew/etc/xml/catalog
          ls -lah /usr/local/etc/xml/catalog
          ls -lah /opt/homebrew/etc/xml/catalog

      - name: Resolve VERSION safely (POSIX debug)
        id: ver
        run: |
          set -euxo pipefail
          echo "Raw output from bin/latest-git-version:"
          bin/latest-git-version || true
          # Parse first X.Y.Z from whatever it prints
          VER="$(bin/latest-git-version 2>/dev/null | tr -d '\r' | grep -Eo '[0-9]+\.[0-9]+\.[0-9]+' | head -n1 || true)"
          if [[ -z "$VER" ]]; then
            # Fallback: avoid relying on the script at all
            # (Still no repo changes; just use a known tag or fail clearly)
            echo "Failed to parse VERSION from bin/latest-git-version output" >&2
            exit 1
          fi
          echo "Resolved VERSION=$VER"
          echo "VERSION=$VER" >> "$GITHUB_OUTPUT"

      - name: Build installer package (force GNU make, override VERSION)
        run: |
          set -euxo pipefail
          "$HOME/gmake/bin/make" clean VERSION='${{ steps.ver.outputs.VERSION }}' || true
          "$HOME/gmake/bin/make" package VERSION='${{ steps.ver.outputs.VERSION }}'

      - name: List outputs
        if: always()
        run: |
          set -euxo pipefail
          ls -lah
          ls -lah build || true
          ls -lah tmp || true
          ls -lah stage || true
          ls -lah stage-arm || true
          ls -lah stage-intel || true

      - name: Upload artifacts (pkg/dmg/zip)
        uses: actions/upload-artifact@v4
        with:
          name: git-osx-installer
          path: |
            git-*.pkg
            git-*.dmg
            git-*.zip
            build/**/*.pkg
            tmp/**/*.pkg
            stage/**/*.pkg
